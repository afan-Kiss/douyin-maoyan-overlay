<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电影互动榜</title>
    <link rel="stylesheet" href="fonts/harmonyos-sans.css" />
    <link rel="stylesheet" href="fonts/mtsi-font.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="viewport" class="viewport">
      <div class="stage">
        <div class="bg-layer" aria-hidden="true">
          <div class="bg-base"></div>
          <div class="bg-stars"></div>
          <div class="bg-nebula bg-nebula--a"></div>
          <div class="bg-nebula bg-nebula--b"></div>
          <div class="bg-vignette"></div>
        </div>

        <header class="ix-header">
          <div class="ix-header__left">
            <span class="ix-live"><i class="ix-live__dot"></i>LIVE</span>
            <span class="ix-viewers" id="ix-viewers" aria-label="在线人数">
              <span class="ix-viewers__icon" aria-hidden="true">👤</span>
              <span class="ix-viewers__count" id="ix-viewer-count">--</span>
            </span>
          </div>
          <h1 class="ix-title" id="ix-title">电影互动榜</h1>
          <div class="ix-header__right">
            <time class="ix-clock" id="ix-clock">----/--/-- --:--:--</time>
            <button class="titlebar__btn titlebar__btn--login is-hidden" id="btn-login" title="登录猫眼账号">
              登录
            </button>
          </div>
        </header>

        <div id="status" class="status status--loading">正在启动票房服务…</div>

        <section class="ix-board" aria-label="电影互动榜">
          <div class="ix-board__head" role="row">
            <span class="ix-col ix-col--rank">排名</span>
            <span class="ix-col ix-col--film">影片名称</span>
            <span class="ix-col ix-col--box">实时票房</span>
            <span class="ix-col ix-col--rate">票房占比</span>
            <span class="ix-col ix-col--show">排片占比</span>
            <span class="ix-col ix-col--score">直播间评分</span>
          </div>
          <div class="race-list" id="race-list" role="list"></div>
        </section>

        <footer class="ix-bottom">
          <aside class="ix-guide" id="ix-guide" aria-label="互动方式">
            <h2 class="ix-guide__title"><span aria-hidden="true">💬</span> 互动方式</h2>
            <ul class="ix-guide__list">
              <li>送礼物获得可评分积分</li>
              <li><strong>1钻 = 10分</strong></li>
              <li>送礼后<strong>3分钟</strong>内发送：</li>
              <li class="ix-guide__cmds">
                <code>电影名 + 好评</code>
                <code>电影名 + 差评</code>
              </li>
              <li>一次有效评分将使用当前全部未过期积分</li>
              <li class="ix-guide__example">
                例如：<code>哪吒 好评</code>　<code>哪吒 差评</code>
              </li>
            </ul>
            <p class="ix-guide__disclaimer">
              仅供娱乐，直播间互动评分不代表影片质量或官方评分；礼物为自愿互动，请理性消费。
            </p>
          </aside>
          <div class="ix-cloud" id="ix-word-cloud" aria-label="弹幕球"></div>
        </footer>

        <!-- 票房 pipeline / 回归测试保留节点（正式直播画面隐藏） -->
        <div class="pipeline-anchor" aria-hidden="true">
          <span id="hero-date"></span>
          <span id="nation-box"></span>
          <span class="js-nation-unit">万</span>
          <span id="nation-delta" class="nation-pill__delta"></span>
          <span id="champ-box"></span>
          <span id="champ-box-unit">万</span>
          <span id="nation-shows"></span>
          <span id="nation-views"></span>
          <span id="nation-seat"></span>
          <span id="nation-seat-label"></span>
          <div id="nation-strip" class="nation-strip">
            <div class="nation-pill nation-pill--main">
              <span class="nation-pill__row"><span id="nation-delta-host"></span></span>
            </div>
            <div id="nation-shows-pill"></div>
            <div id="champ-box-pill"></div>
            <div id="nation-views-pill"></div>
            <div id="nation-seat-pill"></div>
          </div>
        </div>

        <div class="delta-overlay" id="delta-overlay" aria-hidden="true"></div>
        <div class="score-bubble-layer" id="score-bubble-layer" aria-hidden="true"></div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
