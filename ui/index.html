<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>票房赛马榜</title>
    <link rel="stylesheet" href="fonts/harmonyos-sans.css" />
    <link rel="stylesheet" href="fonts/mtsi-font.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <div class="bg-layer" aria-hidden="true">
        <div class="bg-veil"></div>
        <div class="bg-glow bg-glow--a"></div>
        <div class="bg-glow bg-glow--b"></div>
        <div class="bg-beam bg-beam--l"></div>
        <div class="bg-beam bg-beam--r"></div>
        <div class="bg-stars"></div>
        <div class="bg-curtain"></div>
      </div>

      <section class="hero">
        <div class="hero__top">
          <div class="hero__live">
            <span class="live-dot"></span>
            <span class="hero__live-label">LIVE</span>
          </div>
          <button class="titlebar__btn titlebar__btn--login" id="btn-login" title="登录">登录</button>
        </div>

        <h1 class="hero__title">票房赛马榜</h1>
        <p class="hero__subtitle">
          多榜齐看 · 谁是今日冠军
          <span class="hero__source">信息取自公开资讯</span>
        </p>

        <div class="hero__champ" id="champ-banner">
          <span class="hero__champ-label">今日冠军</span>
          <span class="hero__champ-name" id="champ-name">--</span>
        </div>

        <div class="nation-strip" id="nation-strip">
          <div class="nation-pill nation-pill--main">
            <span class="nation-pill__label">今日大盘</span>
            <span class="nation-pill__row">
              <span class="nation-pill__value mtsi-font" id="nation-box">--</span>
              <span class="nation-pill__unit js-nation-unit">万</span>
            </span>
          </div>
          <div class="nation-pill" id="champ-box-pill">
            <span class="nation-pill__label">冠军票房</span>
            <span class="nation-pill__row">
              <span class="nation-pill__value mtsi-font" id="champ-box">--</span>
              <span class="nation-pill__unit" id="champ-box-unit">万</span>
            </span>
          </div>
          <div class="nation-pill" id="nation-shows-pill">
            <span class="nation-pill__label">排片</span>
            <span class="nation-pill__value" id="nation-shows">--</span>
          </div>
          <div class="nation-pill" id="nation-views-pill">
            <span class="nation-pill__label">观影人次</span>
            <span class="nation-pill__value" id="nation-views">--</span>
          </div>
        </div>

        <p class="hero__time" id="update-time">实时更新 --:--:--</p>
      </section>

      <div id="status" class="status status--loading">正在启动票房服务…</div>

      <section class="race-list" id="race-list" aria-label="票房榜前十"></section>

      <footer class="stage-footer">
        数据仅供娱乐参考，非官方统计，以实际上映为准
      </footer>

      <div class="delta-overlay" id="delta-overlay" aria-hidden="true"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
